kind = "web"
previewPath = "/"
title = "Flycam Request"
version = "1.0.0"
id = "artifacts/flycam"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25926

[services.development]
run = "pnpm --filter @workspace/flycam run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/flycam", "run", "build" ]
publicDir = "artifacts/flycam/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25926"
BASE_PATH = "/"
