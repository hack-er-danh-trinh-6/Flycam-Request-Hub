name: Windows Task

on:
  workflow_dispatch:
    inputs:
      osChoice:
        description: Windows runner
        required: true
        type: choice
        default: windows-2022
        options:
          - windows-2022
          - windows-2025

jobs:
  build:
    runs-on: ${{ inputs.osChoice }}
    timeout-minutes: 30

    steps:
      - name: Kiểm tra môi trường
        shell: pwsh
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $((Get-CimInstance Win32_OperatingSystem).Caption)"
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion

      - name: Chạy tác vụ của bạn
        shell: pwsh
        run: |
          Write-Host "Đặt các lệnh PowerShell của bạn ở đây"
          # Ví dụ:
          # New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\output"
          # Set-Content "$env:GITHUB_WORKSPACE\output\result.txt" "Hoàn tất"

      - name: Lưu kết quả
        uses: actions/upload-artifact@v4
        with:
          name: windows-output
          path: output/
          if-no-files-found: ignore
