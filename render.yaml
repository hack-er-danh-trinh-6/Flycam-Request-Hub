services:
  - type: web
    name: flycam-api-server
    runtime: node
    buildCommand: npx pnpm@10 install && npx pnpm@10 --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: LOG_LEVEL
        value: info

  - type: web
    name: flycam-frontend
    runtime: static
    buildCommand: PORT=3000 BASE_PATH=/ npx pnpm@10 install && PORT=3000 BASE_PATH=/ npx pnpm@10 --filter @workspace/flycam run build
    staticPublishPath: artifacts/flycam/dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
