services:
  - type: web
    name: flycam-request-hub
    runtime: node
    buildCommand: PORT=3000 BASE_PATH=/ npx pnpm@10 install && PORT=3000 BASE_PATH=/ npx pnpm@10 --filter @workspace/flycam run build && npx pnpm@10 --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: LOG_LEVEL
        value: info
